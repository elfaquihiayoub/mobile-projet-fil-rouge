<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rayons - Session 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800">
    <div class="flex min-h-screen">
        <aside class="w-64 bg-slate-800 text-white flex flex-col p-4">
            <h2 class="text-2xl font-bold mb-8 text-center">GESTION</h2>
            <nav class="flex flex-col gap-2">
                <a href="#" class="bg-slate-700 rounded-xl px-4 py-3 text-sm font-medium hover:bg-slate-600 transition">Rayons</a>
            </nav>
        </aside>

        <div class="flex-1 flex flex-col">
            <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-sm">
                <h1 class="text-xl font-semibold">Gestion des rayons</h1>
                <span class="text-sm text-slate-500">Admin</span>
            </header>

            <main class="p-6 space-y-6">
                <section class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                    <div>
                        <p class="text-sm uppercase tracking-wide text-slate-500">Classification</p>
                        <h2 class="text-3xl font-bold">Rayons</h2>
                    </div>
                    <button id="new-rayon-btn" type="button" class="bg-blue-600 text-white px-5 py-3 rounded-xl font-semibold hover:bg-blue-700 transition">+ Ajouter un rayon</button>
                </section>

                <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
                    <h3 id="rayon-form-title" class="text-lg font-semibold text-slate-700 mb-4">Ajouter un rayon</h3>
                    <form id="rayon-form" class="space-y-4">
                        <div class="grid gap-4 md:grid-cols-2">
                            <div>
                                <label for="nom_rayon" class="block text-sm font-medium text-slate-700 mb-2">Nom du rayon</label>
                                <input id="nom_rayon" name="nom_rayon" type="text" placeholder="Ex: Sciences" class="w-full border border-slate-300 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label for="emplacement" class="block text-sm font-medium text-slate-700 mb-2">Emplacement</label>
                                <input id="emplacement" name="emplacement" type="text" placeholder="Ex: Étage 1 - A" class="w-full border border-slate-300 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>

                        <div class="flex justify-end gap-3">
                            <button id="cancel-rayon-btn" type="button" class="px-4 py-2 rounded-xl border border-slate-300 text-slate-600 hover:bg-slate-100 transition">Annuler</button>
                            <button type="submit" class="px-4 py-2 rounded-xl bg-blue-600 text-white hover:bg-blue-700 transition">Enregistrer</button>
                        </div>
                    </form>
                </section>

                <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="px-6 py-4 border-b border-slate-200">
                        <h3 class="text-lg font-semibold text-slate-700">Liste des rayons</h3>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-slate-200">
                            <thead class="bg-slate-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-slate-500">ID</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-slate-500">Nom</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-slate-500">Emplacement</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-slate-500">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="rayon-table-body" class="divide-y divide-slate-200 bg-white"></tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="./main.js"></script>
</body>
</html>
