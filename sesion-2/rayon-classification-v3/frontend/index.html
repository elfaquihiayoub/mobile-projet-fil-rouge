<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des rayons</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800">
    <div class="flex min-h-screen">
        <aside class="w-64 bg-slate-800 p-4 text-white">
            <h2 class="mb-8 text-center text-2xl font-bold">GESTION</h2>
            <nav>
                <a href="#" class="block rounded-xl bg-slate-700 px-4 py-3 text-sm font-medium">Rayons</a>
            </nav>
        </aside>

        <div class="flex flex-1 flex-col">
            <header class="flex items-center justify-between border-b border-slate-200 bg-white px-6 py-4">
                <h1 class="text-xl font-semibold">Gestion des rayons</h1>
                <span class="text-sm text-slate-500">Admin</span>
            </header>

            <main class="space-y-6 p-6">
                <section class="flex items-center justify-between gap-4">
                    <div>
                        <p class="text-sm uppercase tracking-wide text-slate-500">Classification</p>
                        <h2 class="text-3xl font-bold">Rayons</h2>
                    </div>
                    <button id="new-rayon-btn" type="button" class="rounded-xl bg-blue-600 px-5 py-3 font-semibold text-white hover:bg-blue-700">
                        + Ajouter un rayon
                    </button>
                </section>

                <section id="section-form" class="hidden rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                    <h3 class="mb-4 text-lg font-semibold text-slate-700">Ajouter un rayon</h3>
                    <form id="rayon-form" class="space-y-4">
                        <div class="grid gap-4 md:grid-cols-2">
                            <div>
                                <label for="nom_rayon" class="mb-2 block text-sm font-medium text-slate-700">Nom du rayon</label>
                                <input id="nom_rayon" name="nom_rayon" type="text" required class="w-full rounded-xl border border-slate-300 px-3 py-2">
                            </div>
                            <div>
                                <label for="emplacement" class="mb-2 block text-sm font-medium text-slate-700">Emplacement</label>
                                <input id="emplacement" name="emplacement" type="text" class="w-full rounded-xl border border-slate-300 px-3 py-2">
                            </div>
                        </div>
                        <div class="flex justify-end gap-3">
                            <button id="cancel-rayon-btn" type="button" class="rounded-xl border border-slate-300 px-4 py-2 text-slate-600">
                                Annuler
                            </button>
                            <button type="submit" class="rounded-xl bg-blue-600 px-4 py-2 text-white hover:bg-blue-700">
                                Enregistrer
                            </button>
                        </div>
                    </form>
                </section>

                <section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
                    <div class="border-b border-slate-200 px-6 py-4">
                        <h3 class="text-lg font-semibold text-slate-700">Liste des rayons</h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-slate-200">
                            <thead class="bg-slate-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium uppercase text-slate-500">ID</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium uppercase text-slate-500">Nom</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium uppercase text-slate-500">Emplacement</th>
                                </tr>
                            </thead>
                            <tbody id="rayon-table-body" class="divide-y divide-slate-200 bg-white"></tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <div id="toast-container" class="fixed right-4 top-4 z-50 space-y-2"></div>
    <script src="./assets/app.js"></script>
</body>
</html>
